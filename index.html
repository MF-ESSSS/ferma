<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ферма</title>

<style>
/* ==========================================================================
   БЛОК 2 — СТИЛИ
   Переносите содержимое этого <style> в <head> вашей страницы
   (свой <style> или отдельный style.css через <link rel="stylesheet">).
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap');

:root{
  --black-950:#050402;
  --black-900:#0b0705;

  --orange-300:#ffb454;
  --orange-500:#ff6a1f;
  --orange-600:#e8570f;
  --orange-700:#c6440a;
  --orange-900:#3a1706;

  --green-300:#8dedb0;
  --green-500:#3fcf7a;
  --green-600:#1fa35c;
  --green-700:#157a45;
  --green-900:#0a2e1b;

  --glass-fill-soft: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.14);

  --text-0:#f7efe4;
  --text-1:#cbbba8;
  --text-2:#8d7c6a;

  --r-lg:28px;
  --r-md:18px;
  --r-sm:12px;
  --r-pill:999px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,106,31,0.10), transparent),
    var(--black-950);
  color:var(--text-0);
  font-family:'Manrope', system-ui, sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* --- фоновые "жидкие" пятна света: одно оранжевое, одно зелёное --- */
.blob{ position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; opacity:0.5; }
.blob-a{
  width:520px;height:520px; top:-160px; left:-140px;
  background:radial-gradient(circle, var(--orange-600), transparent 70%);
  animation:driftA 22s ease-in-out infinite alternate;
}
.blob-b{
  width:460px;height:460px; bottom:-160px; right:-120px;
  background:radial-gradient(circle, var(--green-700), transparent 70%);
  animation:driftB 26s ease-in-out infinite alternate;
}
@keyframes driftA{ from{transform:translate(0,0) scale(1);} to{transform:translate(60px,40px) scale(1.12);} }
@keyframes driftB{ from{transform:translate(0,0) scale(1);} to{transform:translate(-40px,-30px) scale(1.08);} }
@media (prefers-reduced-motion: reduce){ .blob-a,.blob-b{ animation:none; } }

.wrap{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:48px 20px 80px; }

/* --- шапка --- */
.brand{ display:flex; align-items:center; gap:10px; margin-bottom:32px; }
.brand-mark{ width:30px; height:30px; flex-shrink:0; }
.brand-name{ font-family:'Unbounded', sans-serif; font-weight:700; font-size:1.15rem; letter-spacing:-0.01em; }
.brand-sub{ font-size:0.85rem; color:var(--text-2); margin-left:2px; }

/* --- верхний баннер: общий баланс фермы --- */
.net-banner{
  background:linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:var(--r-lg);
  padding:28px 24px;
  text-align:center;
  margin-bottom:20px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.2),
    0 24px 60px -16px rgba(0,0,0,0.65);
}
.net-label{ font-size:0.85rem; color:var(--text-2); margin-bottom:6px; }
.net-value{
  font-family:'Unbounded', sans-serif;
  font-weight:800;
  font-size:clamp(2.4rem, 9vw, 3.8rem);
  letter-spacing:-0.02em;
  display:inline-block;
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
.net-value.positive{ background-image:linear-gradient(135deg, #fff 5%, var(--green-300) 55%, var(--green-600)); }
.net-value.negative{ background-image:linear-gradient(135deg, #fff 5%, var(--orange-300) 55%, var(--orange-600)); }

/* --- сетка из двух копилок --- */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:32px; }
@media (max-width:680px){ .grid{ grid-template-columns:1fr; } }

.card{
  position:relative;
  background:linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02) 45%, rgba(0,0,0,0.18));
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:var(--r-lg);
  padding:26px 22px;
  overflow:hidden;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.2),
    0 20px 50px -14px rgba(0,0,0,0.6);
}
.card::before{
  content:""; position:absolute; top:0; left:8%; width:84%; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
}
.card-income{ border-color:rgba(140,240,175,0.22); box-shadow:inset 0 1px 0 rgba(255,255,255,0.2), 0 20px 50px -14px rgba(0,0,0,0.6), 0 0 70px -28px rgba(63,207,122,0.5); }
.card-expense{ border-color:rgba(255,170,110,0.24); box-shadow:inset 0 1px 0 rgba(255,255,255,0.2), 0 20px 50px -14px rgba(0,0,0,0.6), 0 0 70px -28px rgba(255,106,31,0.5); }

.card-label{ display:flex; align-items:center; gap:8px; font-size:0.95rem; color:var(--text-1); margin-bottom:10px; }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-income{ background:var(--green-400,var(--green-500)); }
.dot-expense{ background:var(--orange-500); }

.balance{ font-family:'Unbounded', sans-serif; font-weight:800; font-size:clamp(1.7rem, 6vw, 2.4rem); letter-spacing:-0.02em; margin:0 0 20px; display:inline-block; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
.balance-income{ background-image:linear-gradient(135deg, #fff 5%, var(--green-300) 55%, var(--green-600)); }
.balance-expense{ background-image:linear-gradient(135deg, #fff 5%, var(--orange-300) 55%, var(--orange-600)); }

/* --- кнопки-пилюли --- */
.btn{ position:relative; overflow:hidden; border:none; cursor:pointer; font-family:'Manrope', sans-serif; font-weight:600; transition:transform .15s ease, filter .2s ease; }
.btn::after{ content:""; position:absolute; inset:0; background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%); transform:translateX(-120%); transition:transform .6s ease; }
.btn:hover::after{ transform:translateX(120%); }
.btn:active{ transform:scale(0.96); }
.btn:focus-visible{ outline:2px solid var(--text-0); outline-offset:2px; }

.btn-text{ background:transparent; color:var(--text-1); font-size:0.85rem; padding:8px 4px; }
.btn-text:hover{ color:var(--orange-300); }

/* --- строка ввода суммы --- */
.stepper-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.stepper-row.shake{ animation:shake .4s ease; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

.circle-btn{ width:48px; height:48px; border-radius:50%; font-size:1.4rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; line-height:1; }
.circle-btn.glass{ background:var(--glass-fill-soft); }
.circle-btn.income-plus{ background:linear-gradient(135deg, var(--green-500), var(--green-300)); color:#062412; box-shadow:0 8px 22px -6px rgba(63,207,122,0.6); }
.circle-btn.income-minus{ background:var(--glass-fill-soft); border:1.5px solid var(--green-700); color:var(--green-300); }
.circle-btn.expense-plus{ background:linear-gradient(135deg, var(--orange-500), var(--orange-300)); color:#241004; box-shadow:0 8px 22px -6px rgba(255,106,31,0.6); }
.circle-btn.expense-minus{ background:var(--glass-fill-soft); border:1.5px solid var(--orange-700); color:var(--orange-300); }

.amount-input{
  flex:1; min-width:0; text-align:center;
  background:rgba(0,0,0,0.25); border:1px solid var(--glass-border); color:var(--text-0);
  font-family:'Unbounded', sans-serif; font-weight:600; font-size:1rem;
  padding:12px 6px; border-radius:var(--r-md); -moz-appearance:textfield;
}
.amount-input::-webkit-outer-spin-button, .amount-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.amount-input:focus-visible{ outline:2px solid var(--text-0); outline-offset:1px; }

/* --- чипсы с быстрыми суммами --- */
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ background:var(--glass-fill-soft); border:1px solid var(--glass-border); color:var(--text-1); padding:7px 12px; border-radius:var(--r-pill); font-size:0.8rem; }
.card-income .chip:hover, .card-income .chip.active{ color:var(--green-300); border-color:var(--green-700); background:rgba(80,220,140,0.14); }
.card-expense .chip:hover, .card-expense .chip.active{ color:var(--orange-300); border-color:var(--orange-700); background:rgba(255,150,80,0.14); }

/* --- история операций (общая) --- */
.history-section{ margin-top:8px; }
.history-title{ font-family:'Unbounded', sans-serif; font-size:1rem; font-weight:600; margin:0 0 14px; }
.history-list{ display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto; }
.history-item{ display:flex; align-items:center; gap:12px; background:var(--glass-fill-soft); border:1px solid rgba(255,255,255,0.08); border-radius:var(--r-md); padding:12px 14px; }
.history-item.income .history-amount{ color:var(--green-300); }
.history-item.expense .history-amount{ color:var(--orange-300); }
.history-tag{ font-size:0.72rem; color:var(--text-2); border:1px solid rgba(255,255,255,0.12); border-radius:var(--r-pill); padding:2px 8px; flex-shrink:0; }
.history-amount{ font-weight:700; font-family:'Unbounded', sans-serif; font-size:0.95rem; }
.history-time{ margin-left:auto; font-size:0.78rem; color:var(--text-2); white-space:nowrap; }
.history-empty{ color:var(--text-2); font-size:0.9rem; padding:18px 4px; text-align:center; }

.reset-row{ text-align:center; margin-top:22px; }

.is-loading .card, .is-loading .net-banner{ opacity:0.4; pointer-events:none; }

@media (max-width:420px){
  .card{ padding:22px 18px; }
  .circle-btn{ width:44px; height:44px; font-size:1.25rem; }
}
</style>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>

<!-- ==========================================================================
     БЛОК 1 — HTML-РАЗМЕТКА
     Содержимое <div class="wrap"> вставляйте в <body> вашей страницы.
     ========================================================================== -->
<div class="wrap" id="wrap">

  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4ADE80"/>
          <stop offset="100%" stop-color="#FF6A1F"/>
        </linearGradient>
      </defs>
      <circle cx="16" cy="16" r="9" fill="none" stroke="url(#markGrad)" stroke-width="2.4"/>
      <line x1="16" y1="2" x2="16" y2="9" stroke="url(#markGrad)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="16" y1="23" x2="16" y2="30" stroke="url(#markGrad)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="2" y1="16" x2="9" y2="16" stroke="url(#markGrad)" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="23" y1="16" x2="30" y2="16" stroke="url(#markGrad)" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">Ферма</span>
    <span class="brand-sub">учёт доходов и расходов</span>
  </div>

  <div class="net-banner">
    <div class="net-label">Баланс фермы</div>
    <div class="net-value" id="netValue" aria-live="polite">0 zł</div>
  </div>

  <div class="grid">

    <!-- Копилка доходов -->
    <div class="card card-income">
      <div class="card-label"><span class="dot dot-income"></span>Доходы</div>
      <div class="balance balance-income" id="incomeBalance" aria-live="polite">0 zł</div>

      <div class="stepper-row" id="incomeStepper">
        <button class="circle-btn income-minus btn" id="incomeMinusBtn" aria-label="Убавить доходы">−</button>
        <input class="amount-input" id="incomeAmountInput" type="number" inputmode="numeric" min="1" value="100" aria-label="Сумма дохода" />
        <button class="circle-btn income-plus btn" id="incomePlusBtn" aria-label="Добавить доход">+</button>
      </div>

      <div class="chips" id="incomeChips">
        <button class="btn chip" data-amount="50">50 zł</button>
        <button class="btn chip" data-amount="100">100 zł</button>
        <button class="btn chip" data-amount="500">500 zł</button>
        <button class="btn chip" data-amount="1000">1000 zł</button>
      </div>
    </div>

    <!-- Копилка расходов -->
    <div class="card card-expense">
      <div class="card-label"><span class="dot dot-expense"></span>Расходы</div>
      <div class="balance balance-expense" id="expenseBalance" aria-live="polite">0 zł</div>

      <div class="stepper-row" id="expenseStepper">
        <button class="circle-btn expense-minus btn" id="expenseMinusBtn" aria-label="Убавить расходы">−</button>
        <input class="amount-input" id="expenseAmountInput" type="number" inputmode="numeric" min="1" value="100" aria-label="Сумма расхода" />
        <button class="circle-btn expense-plus btn" id="expensePlusBtn" aria-label="Добавить расход">+</button>
      </div>

      <div class="chips" id="expenseChips">
        <button class="btn chip" data-amount="50">50 zł</button>
        <button class="btn chip" data-amount="100">100 zł</button>
        <button class="btn chip" data-amount="500">500 zł</button>
        <button class="btn chip" data-amount="1000">1000 zł</button>
      </div>
    </div>

  </div>

  <div class="history-section">
    <h2 class="history-title">История</h2>
    <div class="history-list" id="historyList">
      <div class="history-empty">Пока нет операций</div>
    </div>
  </div>

  <div class="reset-row">
    <button class="btn btn-text" id="resetBtn">Обнулить всё</button>
  </div>

</div>

<!-- ==========================================================================
     БЛОК 3 — JAVASCRIPT
     Вставляйте перед закрывающим </body>.
     ⚠ window.storage работает только внутри артефактов Claude.
     На своём сайте замените loadState/saveState на localStorage
     (готовые строки-замена — в комментариях внутри этих функций).
     ========================================================================== -->
<script>
(function(){
  const STORAGE_KEY = 'ferma-state';

  const defaultState = { income:0, expense:0, transactions:[] }; // {id, category:'income'|'expense', delta, ts}
  let state = null;

  const els = {
    wrap: document.getElementById('wrap'),
    netValue: document.getElementById('netValue'),
    incomeBalance: document.getElementById('incomeBalance'),
    expenseBalance: document.getElementById('expenseBalance'),
    historyList: document.getElementById('historyList'),

    incomeAmountInput: document.getElementById('incomeAmountInput'),
    incomePlusBtn: document.getElementById('incomePlusBtn'),
    incomeMinusBtn: document.getElementById('incomeMinusBtn'),
    incomeStepper: document.getElementById('incomeStepper'),
    incomeChips: document.getElementById('incomeChips'),

    expenseAmountInput: document.getElementById('expenseAmountInput'),
    expensePlusBtn: document.getElementById('expensePlusBtn'),
    expenseMinusBtn: document.getElementById('expenseMinusBtn'),
    expenseStepper: document.getElementById('expenseStepper'),
    expenseChips: document.getElementById('expenseChips'),

    resetBtn: document.getElementById('resetBtn')
  };

  function formatZl(n){
    return Math.round(n).toLocaleString('pl-PL') + ' zł';
  }

  function formatTime(ts){
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now); yest.setDate(now.getDate()-1);
    const isYest = d.toDateString() === yest.toDateString();
    const time = d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    if (sameDay) return 'сегодня, ' + time;
    if (isYest) return 'вчера, ' + time;
    return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'}) + ', ' + time;
  }

  function animateNumber(el, from, to){
    const duration = 500;
    const start = performance.now();
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion){ el.textContent = formatZl(to); return; }
    function frame(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3);
      el.textContent = formatZl(from + (to-from)*eased);
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function render(prev){
    prev = prev || {};
    animateNumber(els.incomeBalance, prev.income ?? state.income, state.income);
    animateNumber(els.expenseBalance, prev.expense ?? state.expense, state.expense);

    const net = state.income - state.expense;
    const prevNet = (prev.income ?? state.income) - (prev.expense ?? state.expense);
    animateNumber(els.netValue, prevNet, net);
    els.netValue.classList.toggle('positive', net >= 0);
    els.netValue.classList.toggle('negative', net < 0);

    const sorted = [...state.transactions].sort((a,b) => b.ts - a.ts);
    if (sorted.length === 0){
      els.historyList.innerHTML = '<div class="history-empty">Пока нет операций</div>';
    } else {
      els.historyList.innerHTML = sorted.slice(0, 40).map(tx => {
        const sign = tx.delta > 0 ? '+' : '−';
        const tag = tx.category === 'income' ? 'Доходы' : 'Расходы';
        return `<div class="history-item ${tx.category}">
          <span class="history-tag">${tag}</span>
          <span class="history-amount">${sign} ${formatZl(Math.abs(tx.delta))}</span>
          <span class="history-time">${formatTime(tx.ts)}</span>
        </div>`;
      }).join('');
    }
  }

  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      // Альтернатива для обычного сайта:
      // const raw = localStorage.getItem(STORAGE_KEY);
      // return raw ? JSON.parse(raw) : structuredClone(defaultState);
      return res ? JSON.parse(res.value) : structuredClone(defaultState);
    }catch(e){
      return structuredClone(defaultState);
    }
  }

  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      // Альтернатива для обычного сайта:
      // localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.error('Не удалось сохранить', e); }
  }

  function shake(el){ el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); }

  function wireCategory(category, input, plusBtn, minusBtn, stepper, chips){
    plusBtn.addEventListener('click', () => {
      const amt = parseFloat(input.value);
      if (!amt || amt <= 0) return;
      const prev = { income: state.income, expense: state.expense };
      state[category] += amt;
      state.transactions.push({ id: Date.now()+'-'+Math.random(), category, delta: amt, ts: Date.now() });
      render(prev);
      saveState();
    });
    minusBtn.addEventListener('click', () => {
      const amt = parseFloat(input.value);
      if (!amt || amt <= 0) return;
      if (amt > state[category]){ shake(stepper); return; }
      const prev = { income: state.income, expense: state.expense };
      state[category] -= amt;
      state.transactions.push({ id: Date.now()+'-'+Math.random(), category, delta: -amt, ts: Date.now() });
      render(prev);
      saveState();
    });
    chips.addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      input.value = btn.dataset.amount;
      [...chips.querySelectorAll('.chip')].forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    });
  }

  wireCategory('income', els.incomeAmountInput, els.incomePlusBtn, els.incomeMinusBtn, els.incomeStepper, els.incomeChips);
  wireCategory('expense', els.expenseAmountInput, els.expensePlusBtn, els.expenseMinusBtn, els.expenseStepper, els.expenseChips);

  els.resetBtn.addEventListener('click', () => {
    const ok = confirm('Обнулить доходы, расходы и историю?');
    if (!ok) return;
    const prev = { income: state.income, expense: state.expense };
    state.income = 0; state.expense = 0; state.transactions = [];
    render(prev);
    saveState();
  });

  (async function init(){
    els.wrap.classList.add('is-loading');
    state = await loadState();
    els.wrap.classList.remove('is-loading');
    render({ income:0, expense:0 });
  })();
})();
</script>

</body>
</html>
