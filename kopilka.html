<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Копилка</title>

<style>
/* ==========================================================================
   БЛОК 2 — СТИЛИ
   Если переносите на свой сайт: всё содержимое этого <style> вставляйте
   в <head> вашей страницы (в свой <style> или в отдельный файл style.css,
   подключённый через <link rel="stylesheet" href="style.css">).
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap');

:root{
  --black-950:#050402;
  --black-900:#0b0705;
  --black-850:#15100a;
  --orange-300:#ffb454;
  --orange-500:#ff6a1f;
  --orange-600:#e8570f;
  --orange-700:#c6440a;
  --orange-900:#3a1706;

  --glass-fill: linear-gradient(160deg, rgba(255,150,80,0.12), rgba(255,255,255,0.03) 45%, rgba(0,0,0,0.20));
  --glass-fill-soft: rgba(255,255,255,0.05);
  --glass-border: rgba(255,180,120,0.18);

  --text-0:#f7efe4;
  --text-1:#cbbba8;
  --text-2:#8d7c6a;

  --r-lg:28px;
  --r-md:18px;
  --r-sm:12px;
  --r-pill:999px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,106,31,0.14), transparent),
    var(--black-950);
  color:var(--text-0);
  font-family:'Manrope', system-ui, sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* --- фоновые "жидкие" пятна света --- */
.blob{
  position:fixed;
  border-radius:50%;
  filter:blur(90px);
  z-index:0;
  pointer-events:none;
  opacity:0.55;
}
.blob-a{
  width:520px;height:520px;
  top:-160px; left:-140px;
  background:radial-gradient(circle, var(--orange-600), transparent 70%);
  animation:driftA 22s ease-in-out infinite alternate;
}
.blob-b{
  width:420px;height:420px;
  bottom:-140px; right:-120px;
  background:radial-gradient(circle, var(--orange-900), transparent 70%);
  animation:driftB 26s ease-in-out infinite alternate;
}
@keyframes driftA{
  from{ transform:translate(0,0) scale(1); }
  to{ transform:translate(60px,40px) scale(1.12); }
}
@keyframes driftB{
  from{ transform:translate(0,0) scale(1); }
  to{ transform:translate(-40px,-30px) scale(1.08); }
}
@media (prefers-reduced-motion: reduce){
  .blob-a, .blob-b{ animation:none; }
}

.wrap{
  position:relative;
  z-index:1;
  max-width:560px;
  margin:0 auto;
  padding:48px 20px 80px;
}

/* --- шапка / логотип --- */
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:36px;
}
.brand-mark{ width:30px; height:30px; flex-shrink:0; }
.brand-name{
  font-family:'Unbounded', sans-serif;
  font-weight:700;
  font-size:1.15rem;
  letter-spacing:-0.01em;
}

/* --- стеклянная карточка (liquid glass) --- */
.card{
  position:relative;
  background:var(--glass-fill);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:var(--r-lg);
  padding:32px 28px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    0 24px 60px -12px rgba(0,0,0,0.65),
    0 0 90px -30px rgba(255,106,31,0.45);
  overflow:hidden;
}
.card::before{
  /* блик по верхней кромке — имитация преломления света в стекле */
  content:"";
  position:absolute;
  top:0; left:8%;
  width:84%; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
}

.goal-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}
.goal-name{
  font-size:0.95rem;
  color:var(--text-1);
}
.goal-name b{ color:var(--text-0); font-weight:600; }

.icon-btn{
  background:var(--glass-fill-soft);
  border:1px solid var(--glass-border);
  color:var(--orange-300);
  width:32px; height:32px;
  border-radius:var(--r-sm);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:background .2s ease, transform .2s ease;
  flex-shrink:0;
}
.icon-btn:hover{ background:rgba(255,150,80,0.14); }
.icon-btn:active{ transform:scale(0.94); }

/* --- баланс --- */
.balance-label{
  font-size:0.85rem;
  color:var(--text-2);
  margin-bottom:2px;
}
.balance{
  font-family:'Unbounded', sans-serif;
  font-weight:800;
  font-size:clamp(2.4rem, 9vw, 3.6rem);
  line-height:1.05;
  letter-spacing:-0.02em;
  background:linear-gradient(135deg, #fff 5%, var(--orange-300) 55%, var(--orange-500));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin:0 0 20px;
}

/* --- прогресс к цели --- */
.progress-track{
  height:10px;
  border-radius:var(--r-pill);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  overflow:hidden;
  margin-bottom:8px;
}
.progress-fill{
  height:100%;
  border-radius:var(--r-pill);
  background:linear-gradient(90deg, var(--orange-700), var(--orange-300));
  transition:width .6s cubic-bezier(.4,0,.2,1);
  width:0%;
}
.progress-meta{
  display:flex;
  justify-content:space-between;
  font-size:0.8rem;
  color:var(--text-2);
  margin-bottom:26px;
}
.progress-meta strong{ color:var(--text-1); font-weight:600; }

/* --- выпадающая панель редактирования цели --- */
.edit-drawer{
  max-height:0;
  overflow:hidden;
  transition:max-height .35s ease, margin .35s ease;
  margin-bottom:0;
}
.edit-drawer.open{
  max-height:220px;
  margin-bottom:26px;
}
.edit-drawer-inner{
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.field-label{ font-size:0.78rem; color:var(--text-2); }
.field-input{
  width:100%;
  background:rgba(0,0,0,0.25);
  border:1px solid var(--glass-border);
  color:var(--text-0);
  font-family:inherit;
  font-size:0.95rem;
  padding:10px 12px;
  border-radius:var(--r-sm);
}
.field-input:focus-visible{ outline:2px solid var(--orange-500); outline-offset:1px; }
.drawer-actions{ display:flex; gap:8px; margin-top:4px; }

/* --- кнопки-пилюли (общий стиль) --- */
.btn{
  position:relative;
  overflow:hidden;
  border:none;
  cursor:pointer;
  font-family:'Manrope', sans-serif;
  font-weight:600;
  transition:transform .15s ease, filter .2s ease;
}
.btn::after{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
  transform:translateX(-120%);
  transition:transform .6s ease;
}
.btn:hover::after{ transform:translateX(120%); }
.btn:active{ transform:scale(0.96); }
.btn:focus-visible{ outline:2px solid var(--orange-300); outline-offset:2px; }

.btn-text{
  background:transparent;
  color:var(--text-1);
  font-size:0.85rem;
  padding:8px 4px;
}
.btn-text:hover{ color:var(--orange-300); }

.btn-save{
  background:linear-gradient(135deg, var(--orange-500), var(--orange-300));
  color:#241004;
  border-radius:var(--r-pill);
  padding:10px 18px;
  font-size:0.85rem;
}
.btn-cancel{
  background:var(--glass-fill-soft);
  border:1px solid var(--glass-border);
  color:var(--text-1);
  border-radius:var(--r-pill);
  padding:10px 18px;
  font-size:0.85rem;
}

/* --- строка ввода суммы + и − --- */
.stepper-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}
.stepper-row.shake{ animation:shake .4s ease; }
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  25%{ transform:translateX(-6px); }
  75%{ transform:translateX(6px); }
}

.circle-btn{
  width:56px; height:56px;
  border-radius:50%;
  font-size:1.6rem;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  line-height:1;
}
.circle-btn.plus{
  background:linear-gradient(135deg, var(--orange-500), var(--orange-300));
  color:#241004;
  box-shadow:0 8px 24px -6px rgba(255,106,31,0.65);
}
.circle-btn.minus{
  background:var(--glass-fill-soft);
  border:1.5px solid var(--orange-700);
  color:var(--orange-300);
}

.amount-input{
  flex:1;
  min-width:0;
  text-align:center;
  background:rgba(0,0,0,0.25);
  border:1px solid var(--glass-border);
  color:var(--text-0);
  font-family:'Unbounded', sans-serif;
  font-weight:600;
  font-size:1.1rem;
  padding:14px 8px;
  border-radius:var(--r-md);
  -moz-appearance:textfield;
}
.amount-input::-webkit-outer-spin-button,
.amount-input::-webkit-inner-spin-button{
  -webkit-appearance:none; margin:0;
}
.amount-input:focus-visible{ outline:2px solid var(--orange-500); outline-offset:1px; }

/* --- быстрые суммы (чипсы) --- */
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.chip{
  background:var(--glass-fill-soft);
  border:1px solid var(--glass-border);
  color:var(--text-1);
  padding:8px 14px;
  border-radius:var(--r-pill);
  font-size:0.85rem;
}
.chip:hover{ color:var(--orange-300); border-color:var(--orange-700); }
.chip.active{
  background:rgba(255,150,80,0.16);
  color:var(--orange-300);
  border-color:var(--orange-500);
}

/* --- история операций --- */
.history-section{ margin-top:32px; }
.history-title{
  font-family:'Unbounded', sans-serif;
  font-size:1rem;
  font-weight:600;
  margin:0 0 14px;
  color:var(--text-0);
}
.history-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:260px;
  overflow-y:auto;
}
.history-item{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--glass-fill-soft);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--r-md);
  padding:12px 14px;
}
.history-dot{
  width:8px; height:8px; border-radius:50%;
  flex-shrink:0;
}
.history-item.pos .history-dot{ background:var(--orange-300); }
.history-item.neg .history-dot{ background:var(--text-2); }
.history-amount{ font-weight:700; font-family:'Unbounded', sans-serif; font-size:0.95rem; }
.history-item.pos .history-amount{ color:var(--orange-300); }
.history-item.neg .history-amount{ color:var(--text-1); }
.history-time{
  margin-left:auto;
  font-size:0.78rem;
  color:var(--text-2);
  white-space:nowrap;
}
.history-empty{
  color:var(--text-2);
  font-size:0.9rem;
  padding:18px 4px;
  text-align:center;
}

.reset-row{ text-align:center; margin-top:22px; }

.is-loading .card{ opacity:0.4; pointer-events:none; }

@media (max-width:420px){
  .card{ padding:26px 20px; }
  .circle-btn{ width:50px; height:50px; font-size:1.4rem; }
}
</style>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>

<!-- ==========================================================================
     БЛОК 1 — HTML-РАЗМЕТКА
     Если переносите на свой сайт: всё содержимое этого <div class="wrap">
     вставляйте в то место <body>, где должна быть копилка.
     ========================================================================== -->
<div class="wrap" id="wrap">

  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffb454"/>
          <stop offset="100%" stop-color="#ff6a1f"/>
        </linearGradient>
      </defs>
      <circle cx="16" cy="16" r="15" fill="url(#markGrad)"/>
      <rect x="10" y="15" width="12" height="2.4" rx="1.2" fill="#241004"/>
    </svg>
    <span class="brand-name">Копилка</span>
  </div>

  <div class="card">
    <div class="goal-row">
      <div class="goal-name">Цель: <b id="goalNameText">Новый ноутбук</b></div>
      <button class="icon-btn" id="editGoalBtn" aria-label="Изменить цель" aria-expanded="false">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>
    </div>

    <div class="balance-label">Накоплено</div>
    <div class="balance" id="balanceText" aria-live="polite">0 ₽</div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-meta">
      <span>до цели <strong id="remainingText">60 000 ₽</strong></span>
      <span id="percentText">0%</span>
    </div>

    <div class="edit-drawer" id="editDrawer">
      <div class="edit-drawer-inner">
        <div>
          <div class="field-label">Название цели</div>
          <input class="field-input" id="goalNameInput" type="text" maxlength="40" />
        </div>
        <div>
          <div class="field-label">Сумма цели, ₽</div>
          <input class="field-input" id="goalAmountInput" type="number" min="1" />
        </div>
        <div class="drawer-actions">
          <button class="btn btn-save" id="saveGoalBtn">Сохранить</button>
          <button class="btn btn-cancel" id="cancelGoalBtn">Отмена</button>
        </div>
      </div>
    </div>

    <div class="stepper-row" id="stepperRow">
      <button class="circle-btn minus btn" id="minusBtn" aria-label="Списать сумму">−</button>
      <input class="amount-input" id="amountInput" type="number" inputmode="numeric" min="1" value="100" aria-label="Сумма" />
      <button class="circle-btn plus btn" id="plusBtn" aria-label="Пополнить на сумму">+</button>
    </div>

    <div class="chips" id="chips">
      <button class="btn chip" data-amount="100">100 ₽</button>
      <button class="btn chip" data-amount="500">500 ₽</button>
      <button class="btn chip" data-amount="1000">1 000 ₽</button>
      <button class="btn chip" data-amount="5000">5 000 ₽</button>
    </div>
  </div>

  <div class="history-section">
    <h2 class="history-title">История</h2>
    <div class="history-list" id="historyList">
      <div class="history-empty">Пока нет операций — добавьте первую сумму</div>
    </div>
  </div>

  <div class="reset-row">
    <button class="btn btn-text" id="resetBtn">Обнулить копилку</button>
  </div>

</div>

<!-- ==========================================================================
     БЛОК 3 — JAVASCRIPT
     Если переносите на свой сайт: весь этот <script> вставляйте
     перед закрывающим тегом </body>.
     ⚠ ВАЖНО: window.storage (сохранение данных) работает только
     внутри артефактов Claude. На обычном сайте эти вызовы нужно
     заменить на localStorage или на запросы к своему серверу —
     готовые альтернативные строки помечены комментариями ниже.
     ========================================================================== */
   -->
<script>
(function(){
  const STORAGE_KEY = 'kopilka-state';

  const defaultState = {
    goalName: 'Новый ноутбук',
    goalAmount: 60000,
    balance: 0,
    transactions: [] // {id, amount, ts}  amount может быть + или −
  };

  let state = null;

  const els = {
    wrap: document.getElementById('wrap'),
    balanceText: document.getElementById('balanceText'),
    goalNameText: document.getElementById('goalNameText'),
    progressFill: document.getElementById('progressFill'),
    remainingText: document.getElementById('remainingText'),
    percentText: document.getElementById('percentText'),
    historyList: document.getElementById('historyList'),
    amountInput: document.getElementById('amountInput'),
    plusBtn: document.getElementById('plusBtn'),
    minusBtn: document.getElementById('minusBtn'),
    stepperRow: document.getElementById('stepperRow'),
    chips: document.getElementById('chips'),
    editGoalBtn: document.getElementById('editGoalBtn'),
    editDrawer: document.getElementById('editDrawer'),
    goalNameInput: document.getElementById('goalNameInput'),
    goalAmountInput: document.getElementById('goalAmountInput'),
    saveGoalBtn: document.getElementById('saveGoalBtn'),
    cancelGoalBtn: document.getElementById('cancelGoalBtn'),
    resetBtn: document.getElementById('resetBtn')
  };

  function formatRub(n){
    return Math.round(n).toLocaleString('ru-RU') + ' ₽';
  }

  function formatTime(ts){
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now); yest.setDate(now.getDate()-1);
    const isYest = d.toDateString() === yest.toDateString();
    const time = d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    if (sameDay) return 'сегодня, ' + time;
    if (isYest) return 'вчера, ' + time;
    return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'}) + ', ' + time;
  }

  // --- анимация счётчика баланса ---
  function animateBalance(from, to){
    const duration = 500;
    const start = performance.now();
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion){
      els.balanceText.textContent = formatRub(to);
      return;
    }
    function frame(now){
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const val = from + (to - from) * eased;
      els.balanceText.textContent = formatRub(val);
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function render(prevBalance){
    els.goalNameText.textContent = state.goalName;
    animateBalance(prevBalance == null ? state.balance : prevBalance, state.balance);

    const pct = state.goalAmount > 0 ? Math.min(100, (state.balance / state.goalAmount) * 100) : 0;
    els.progressFill.style.width = pct + '%';
    els.percentText.textContent = Math.round(pct) + '%';
    const remaining = Math.max(0, state.goalAmount - state.balance);
    els.remainingText.textContent = formatRub(remaining);

    // история — последние операции сверху
    const sorted = [...state.transactions].sort((a,b) => b.ts - a.ts);
    if (sorted.length === 0){
      els.historyList.innerHTML = '<div class="history-empty">Пока нет операций — добавьте первую сумму</div>';
    } else {
      els.historyList.innerHTML = sorted.slice(0, 30).map(tx => {
        const isPos = tx.amount > 0;
        const sign = isPos ? '+' : '−';
        return `<div class="history-item ${isPos ? 'pos' : 'neg'}">
          <span class="history-dot"></span>
          <span class="history-amount">${sign} ${formatRub(Math.abs(tx.amount))}</span>
          <span class="history-time">${formatTime(tx.ts)}</span>
        </div>`;
      }).join('');
    }
  }

  // --- сохранение / загрузка состояния ---
  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      // Альтернатива для обычного сайта:
      // const raw = localStorage.getItem(STORAGE_KEY);
      // return raw ? JSON.parse(raw) : structuredClone(defaultState);
      return res ? JSON.parse(res.value) : structuredClone(defaultState);
    }catch(e){
      return structuredClone(defaultState);
    }
  }

  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      // Альтернатива для обычного сайта:
      // localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error('Не удалось сохранить копилку', e);
    }
  }

  function getInputAmount(){
    const v = parseFloat(els.amountInput.value);
    return (!v || v <= 0) ? 0 : v;
  }

  function shakeStepper(){
    els.stepperRow.classList.add('shake');
    setTimeout(() => els.stepperRow.classList.remove('shake'), 400);
  }

  // --- действия ---
  els.plusBtn.addEventListener('click', () => {
    const amt = getInputAmount();
    if (amt <= 0) return;
    const prev = state.balance;
    state.balance += amt;
    state.transactions.push({ id: Date.now()+'-'+Math.random(), amount: amt, ts: Date.now() });
    render(prev);
    saveState();
  });

  els.minusBtn.addEventListener('click', () => {
    const amt = getInputAmount();
    if (amt <= 0) return;
    if (amt > state.balance){
      shakeStepper();
      return;
    }
    const prev = state.balance;
    state.balance -= amt;
    state.transactions.push({ id: Date.now()+'-'+Math.random(), amount: -amt, ts: Date.now() });
    render(prev);
    saveState();
  });

  els.chips.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    els.amountInput.value = btn.dataset.amount;
    [...els.chips.querySelectorAll('.chip')].forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
  });

  // --- редактирование цели ---
  function openDrawer(){
    els.goalNameInput.value = state.goalName;
    els.goalAmountInput.value = state.goalAmount;
    els.editDrawer.classList.add('open');
    els.editGoalBtn.setAttribute('aria-expanded', 'true');
  }
  function closeDrawer(){
    els.editDrawer.classList.remove('open');
    els.editGoalBtn.setAttribute('aria-expanded', 'false');
  }
  els.editGoalBtn.addEventListener('click', () => {
    els.editDrawer.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  els.cancelGoalBtn.addEventListener('click', closeDrawer);
  els.saveGoalBtn.addEventListener('click', () => {
    const name = els.goalNameInput.value.trim();
    const amount = parseFloat(els.goalAmountInput.value);
    if (!name || !amount || amount <= 0) return;
    state.goalName = name;
    state.goalAmount = amount;
    render(state.balance);
    saveState();
    closeDrawer();
  });

  // --- сброс ---
  els.resetBtn.addEventListener('click', () => {
    const ok = confirm('Обнулить копилку? Все операции будут удалены, цель сохранится.');
    if (!ok) return;
    const prev = state.balance;
    state.balance = 0;
    state.transactions = [];
    render(prev);
    saveState();
  });

  // --- инициализация ---
  (async function init(){
    els.wrap.classList.add('is-loading');
    state = await loadState();
    els.wrap.classList.remove('is-loading');
    render(0);
  })();
})();
</script>

</body>
</html>
